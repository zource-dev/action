name: 'CI/CD Pipeline'
description: 'Performs CI/CD tasks for Node.js projects'

inputs:
  node_version:
    description: 'Node.js version to use'
    required: true
  pnpm_version:
    description: 'PNPM version to use'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for repository checkout'
    required: true
  build:
    description: 'Commands to run build'
    required: false
    default: |
      pnpm run build
  test:
    description: 'Commands to run tests'
    required: false
    default: |
      pnpm run test
  autoupdate:
    description: 'Checks updates (latest,minor,patch) and publish if applied'
    required: false
  branch:
    description: 'Release branch name'
    required: false
    default: master
  username:
    description: 'Github username to commit'
    required: false
  email:
    description: 'User email to commit'
    required: false
  codecov_token:
    description: 'Codecov token for uploading coverage'
    required: false
  publish_tags:
    description: 'Publish on tag push matching pattern (e.g. "v*")'
    required: false
  release_tag:
    description: 'Existing version tag to publish on a manual workflow run'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Checkout repository 📥
      uses: actions/checkout@v6
      with:
        token: ${{ inputs.github_token }}
        ref: ${{ inputs.release_tag || github.ref }}
        fetch-depth: 0

    - name: Verify recovery tag
      id: recovery
      if: inputs.release_tag != ''
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        RELEASE_BRANCH: ${{ inputs.branch }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
          echo "Release tag publishing requires a manual workflow run"
          exit 1
        fi
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must be a version tag such as v1.2.3"
          exit 1
        fi
        VERSION=$(jq -r .version package.json)
        if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
          echo "Release tag $RELEASE_TAG does not match package version $VERSION"
          exit 1
        fi
        if ! TAG_COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
          echo "Release tag $RELEASE_TAG does not exist"
          exit 1
        fi
        if [[ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
          echo "Checkout does not match release tag $RELEASE_TAG"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$TAG_COMMIT" "refs/remotes/origin/$RELEASE_BRANCH"; then
          echo "Release tag $RELEASE_TAG is not on $RELEASE_BRANCH"
          exit 1
        fi
        echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Setup Node.js 🛠️
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        registry-url: 'https://registry.npmjs.org/'

    - name: Install pnpm 📦
      uses: pnpm/action-setup@v5
      with:
        version: ${{ inputs.pnpm_version }}
        run_install: false

    - name: Environment log  ℹ️
      id: env
      run: |
        node --version
        pnpm --version
        echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Install dependencies 🔩
      run: |
        pnpm install --frozen-lockfile
      shell: bash

    - name: Check updates 🔍
      id: updates
      if: ${{ inputs.release_tag == '' && inputs.autoupdate != null && github.ref == format('refs/heads/{0}', inputs.branch) }}
      run: |
        if ! [[ "${{ steps.env.outputs.VERSION }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "${{ steps.env.outputs.VERSION }} is not a release version"
          exit 0
        fi
        echo "AUTOUPDATE=${{ inputs.autoupdate }}"
        echo "VERSION=${{ steps.env.outputs.VERSION }}"
        if [ -z "${{ inputs.username }}" ] || [ -z "${{ inputs.email }}" ]; then
          echo "Ensure username and email are set for autoupdate."
          exit 1
        fi
        npx npm-check-updates -u --target ${{ inputs.autoupdate }}
        if git status --porcelain | grep -q "package.json"; then
          echo "Updates were applied to package.json."
          pnpm install --no-frozen-lockfile
          echo "PUBLISH=true" >> $GITHUB_OUTPUT
        else
          echo "No updates were applied to package.json."
        fi
      shell: bash

    - name: Check tag publish 🏷️
      id: tag_publish
      if: ${{ inputs.publish_tags != null && startsWith(github.ref, 'refs/tags/') }}
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        PATTERN="${{ inputs.publish_tags }}"
        if [[ "$TAG" != $PATTERN ]]; then
          echo "Tag $TAG does not match pattern $PATTERN"
          exit 0
        fi
        BRANCH="${{ inputs.branch }}"
        if ! git branch -r --contains HEAD | grep -q "origin/$BRANCH"; then
          echo "Tag $TAG is not on $BRANCH branch, skipping publish"
          exit 1
        fi
        echo "Tag $TAG matches pattern $PATTERN on $BRANCH"
        echo "PUBLISH=true" >> $GITHUB_OUTPUT
      shell: bash

    - name: Run build process 🏗️
      run: |
          ${{ inputs.build }}
      shell: bash

    - name: Run testing 🧪
      if: inputs.test != ''
      run: |
          ${{ inputs.test }}
      shell: bash

    - name: Upload test coverage 📈
      if: inputs.codecov_token != ''
      uses: codecov/codecov-action@v6
      with:
        token: ${{ inputs.codecov_token }}

    - name: Prepare npm publishing
      if: steps.updates.outputs.PUBLISH == 'true' || steps.tag_publish.outputs.PUBLISH == 'true' || steps.recovery.outputs.PUBLISH == 'true'
      run: npm install --global npm@11.19.1
      shell: bash

    - name: Commit 💾
      if: steps.updates.outputs.PUBLISH == 'true'
      run: |
        git config --global user.email "${{ inputs.email }}"
        git config --global user.name "${{ inputs.username }}"
        git add --all
        git commit -am "autoupdate"
        pnpm version patch
        git push
        git push --tags
      shell: bash

    - name: Publish 🚀
      if: steps.updates.outputs.PUBLISH == 'true' || steps.tag_publish.outputs.PUBLISH == 'true' || steps.recovery.outputs.PUBLISH == 'true'
      run: |
        npm publish
      shell: bash
